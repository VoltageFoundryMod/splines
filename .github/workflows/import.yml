name: import new scripts

on:
  schedule:
    - cron: '41 4 * * 1' # weekly, Monday
  workflow_dispatch:
    inputs:
      only:
        description: 'Sources to import (community,awesome,github)'
        default: 'community,awesome,github'

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/import.mjs --only "${{ inputs.only || 'community,awesome,github' }}" | tee import.log
      - run: npm run validate
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: import/automated
          delete-branch: true
          add-paths: norns/**
          commit-message: 'import: new scripts from external sources'
          title: 'import: new scripts from external sources'
          labels: import
          body: |
            Automated import. Every new entry is marked `source: imported` and `ai: unknown`.
            Please skim for things that aren't norns scripts (libraries, mods, forks) and delete those folders before merging.
