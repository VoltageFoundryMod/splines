name: validate entries

on:
  pull_request:
    paths: ['norns/**', 'iii/**', 'scripts/**', 'site.config.json', 'src/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find changed entries
        id: changed
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'norns/*/index.md' 'iii/*/index.md' | paste -sd, -)
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Validate (schema, duplicates, repo checks for changed entries)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ steps.changed.outputs.files }}" ]; then
            node scripts/validate.mjs --online --changed "${{ steps.changed.outputs.files }}"
          else
            node scripts/validate.mjs
          fi
      - name: Build check
        run: npm run build
